# 線上房間的配對服務（Cloudflare Workers 免費方案）。部署：cd workers/signal && npx wrangler deploy
name = "taiwan-mahjong-signal"
main = "src/index.js"
compatibility_date = "2025-06-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "SignalRoom"

# 免費方案只能用 SQLite 版的 Durable Object
[[migrations]]
tag = "v1"
new_sqlite_classes = ["SignalRoom"]
