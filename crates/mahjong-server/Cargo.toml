[package]
name = "mahjong-server"
version = "0.1.0"
license = "MIT"
description = "虛擬台麻館的連線伺服器：WebSocket、HTTP API、MCP；桌面版開房與線上公開伺服器共用"
edition = "2021"
rust-version = "1.89"

[[bin]]
name = "mahjong-server"
path = "src/main.rs"

[dependencies]
mahjong-core = { path = "../mahjong-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }
futures-util = "0.3"
rand = "0.8"
