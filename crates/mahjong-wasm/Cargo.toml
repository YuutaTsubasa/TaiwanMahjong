[package]
name = "mahjong-wasm"
version = "0.1.0"
license = "MIT"
description = "虛擬台麻館單機版：把牌局引擎包成 WebAssembly，在瀏覽器裡跟電腦打"
edition = "2021"
rust-version = "1.89"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mahjong-core = { path = "../mahjong-core" }
serde_json = "1"
wasm-bindgen = "0.2"

[profile.release]
# 電腦算牌要跑得快，所以用速度優先的最佳化
opt-level = 3
lto = true
