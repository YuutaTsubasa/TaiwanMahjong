# 在 GitHub 上打包虛擬台麻館各平台的 App。打包步驟在 VirtualCore 的可重用 workflow（Virtual 系列共用）：
#   https://github.com/YuutaTsubasa/VirtualCore/blob/main/.github/workflows/build-apps.yml
#   手動：Actions → Build apps → Run workflow（檔案在該次執行的 Artifacts）
#   推 v* 標籤（例如 v0.8.0）：打包完自動附到同名的 Release
#
# 產出：Windows .exe／.msi、Linux .deb／.rpm／.AppImage、macOS .dmg（Apple Silicon、Intel 各一）、
# Android .apk（已簽章）、iOS 模擬器用 .app（實機安裝需要 Apple 開發者帳號，見 README）。
# 都沒有程式碼簽章／公證（Windows SmartScreen、macOS Gatekeeper 會跳警告）。
name: Build apps

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: build-apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: YuutaTsubasa/VirtualCore/.github/workflows/build-apps.yml@v0.7.0
    # Android 簽章用的 ANDROID_KEYSTORE_BASE64 等 secrets
    secrets: inherit
    with:
      app-name: VirtualTaiwanMahjongParlor
      wasm-crate: mahjong-wasm
      key-alias: mahjong
      # App 版大廳的分享連結指向網頁版
      web-url: https://yuuta-tsubasa.studio/TaiwanMahjong/
