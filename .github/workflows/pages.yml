# 把單機版與線上房間（牌局引擎是 WebAssembly）部署到 GitHub Pages：
# https://yuuta-tsubasa.studio/TaiwanMahjong/
# 步驟在 VirtualCore 的可重用 workflow（Virtual 系列共用）：
#   https://github.com/YuutaTsubasa/VirtualCore/blob/main/.github/workflows/pages.yml
#
# 線上房間的配對服務預設用 src/lib/site.js 裡已部署的網址；要換成別的，在 repo 的 Variables
# （Settings → Secrets and variables → Actions → Variables）設 SIGNAL_SERVER。
name: Deploy web version to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pages:
    uses: YuutaTsubasa/VirtualCore/.github/workflows/pages.yml@v0.4.0
    with:
      core-crate: mahjong-core
      wasm-crate: mahjong-wasm
      # 網頁版沒有伺服器：藏掉區網開房（VITE_STATIC_SITE=1）
      static-site: true
