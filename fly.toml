# 線上對戰的公開伺服器（crates/mahjong-server）
# 部署：fly deploy --ha=false
# 房間都存在記憶體裡，所以只能有一台機器（--ha=false；之後也不要 fly scale count 超過 1）
app = "taiwan-mahjong"
primary_region = "nrt"

[build]
  dockerfile = "crates/mahjong-server/Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  # 沒有任何連線時機器會停下來省錢，有人連線時再自動啟動（第一個人要多等幾秒）
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    soft_limit = 800
    hard_limit = 1000

  [[http_service.checks]]
    grace_period = "5s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
