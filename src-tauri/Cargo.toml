[package]
name = "taiwan-mahjong"
version = "0.4.3"
description = "虛擬台麻館：線上的台灣十六張麻將，人類、AI 與虛擬角色同桌遊玩"
edition = "2021"
rust-version = "1.89"
default-run = "taiwan-mahjong"

[lib]
name = "taiwan_mahjong_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "mahjong-server"
path = "src/bin/mahjong-server.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mahjong-core = { path = "../crates/mahjong-core" }
mahjong-server = { path = "../crates/mahjong-server" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
